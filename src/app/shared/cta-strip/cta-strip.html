<section class="relative overflow-hidden bg-royal-burgundy py-20 sm:py-28">
  <div class="pointer-events-none absolute -right-32 -top-40 h-[30rem] w-[30rem] rounded-full bg-antique-gold/10 blur-3xl"></div>
  <div class="pointer-events-none absolute -bottom-40 -left-24 h-[28rem] w-[28rem] rounded-full bg-deep-wine/70 blur-3xl"></div>

  <div class="bhb-container relative flex flex-col items-start justify-between gap-10 lg:flex-row lg:items-end">
    <div class="max-w-3xl" data-reveal>
      <span class="eyebrow">{{ eyebrow }}</span>
      <h2 class="mt-6 display-md text-warm-ivory">{{ title }}</h2>
      @if (description) {
        <p class="mt-6 max-w-xl text-sm leading-8 text-champagne/75 sm:text-base">{{ description }}</p>
      }
    </div>

    <div class="flex flex-wrap gap-4" data-reveal>
      <a [routerLink]="primaryLink" class="btn-primary" data-magnetic>{{ primaryLabel }}</a>
      @if (secondaryLabel) {
        <a [routerLink]="secondaryLink" class="btn-outline-light" data-magnetic>{{ secondaryLabel }}</a>
      }
    </div>
  </div>
</section>
